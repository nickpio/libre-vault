name: Platform storage checks
on: [push, pull_request]
jobs:
  storage:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install markdown-it-py PyYAML
      - name: Exercise native locking and recovery without GUI dependencies
        shell: bash
        run: ./check.sh discover -s tests -p test_platform_support.py -v
  full-suite:
    name: Full test suite
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install GTK, Xvfb, and test fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb python3-gi python3-gi-cairo gir1.2-gtk-3.0 \
            python3-markdown-it python3-yaml python3-matplotlib gir1.2-poppler-0.18 \
            gir1.2-gstreamer-1.0 gir1.2-gst-plugins-base-1.0 \
            fonts-noto-core fonts-noto-cjk
      # GUI tests skip without a display, but the smoke test exits non-zero.
      - name: Require a working GTK display
        run: ./check.sh --smoke
      - name: Run all tests
        run: ./check.sh
